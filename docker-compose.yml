services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openrole
      POSTGRES_USER: openrole
      POSTGRES_PASSWORD: openrole
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrole -d openrole"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
